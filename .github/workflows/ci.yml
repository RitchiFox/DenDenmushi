name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/build-wifi-drivers.py
      - run: bash scripts/build-app.sh
      - run: bash scripts/test-swift.sh
      - run: bash scripts/test-localization.sh
